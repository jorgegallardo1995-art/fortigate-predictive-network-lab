{% extends "base.html" %}
{% block heading %}Eventos{% endblock %}

{% block content %}
<section class="chart-controls">
  <label>Ventana:
    <select id="ev-hours">
      <option value="24">24 h</option><option value="168" selected>7 días</option>
      <option value="720">30 días</option><option value="8760">1 año</option>
    </select>
  </label>
  <label>Tipo: <input id="ev-type" placeholder="p. ej. WAN_DOWN"></label>
  <label>Severidad:
    <select id="ev-sev"><option value="">todas</option><option>INFO</option><option>WARNING</option><option>CRITICAL</option></select>
  </label>
  <button class="btn" id="ev-reload">Filtrar</button>
</section>

<section class="panel">
  <div class="table-wrap">
    <table id="ev-table">
      <thead><tr><th>Timestamp (UTC)</th><th>Tipo</th><th>Severidad</th><th>Descripción</th><th>Interfaz</th><th>Experimento</th><th>Fuente</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
async function loadEvents() {
  const h = document.getElementById("ev-hours").value;
  const t = document.getElementById("ev-type").value.trim();
  const s = document.getElementById("ev-sev").value;
  const qs = new URLSearchParams({ hours: h });
  if (t) qs.set("event_type", t);
  if (s) qs.set("severity", s);
  const rows = await PNLApi.get("/api/events?" + qs.toString());
  const tb = document.querySelector("#ev-table tbody");
  tb.innerHTML = rows.map(e => `<tr class="sev-${e.severity.toLowerCase()}">
    <td>${e.timestamp_utc.replace('T',' ').replace('+00:00','')}</td>
    <td>${e.event_type}</td><td>${e.severity}</td><td>${e.description}</td>
    <td>${e.related_interface ?? '—'}</td><td>${e.experiment_id ?? '—'}</td><td>${e.data_source}</td></tr>`).join("")
    || `<tr><td colspan="7" class="muted">Sin eventos en la ventana seleccionada.</td></tr>`;
}
document.getElementById("ev-reload").addEventListener("click", loadEvents);
document.addEventListener("DOMContentLoaded", loadEvents);
</script>
{% endblock %}
