[project]
name = "fortigate-predictive-collector"
version = "0.1.0"
description = "FortiGate telemetry collector and network-continuity research platform (Predictive Network Lab)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["app", "tests"]
extend-exclude = ["app/database/migrations/versions", "app/database/migrations/env.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in argument defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["app/database/migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/database/migrations/*"]
