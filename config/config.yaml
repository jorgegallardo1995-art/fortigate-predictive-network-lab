# =============================================================================
# Predictive Network Lab - non-secret configuration
# =============================================================================
# Secrets (host, token, ports, mode) live in .env - NEVER here.
# This file is safe to commit. Everything here can be changed without touching code.
# =============================================================================

app:
  technical_name: "FortiGate Predictive Network Collector"
  display_name: "Predictive Network Lab"
  subtitle: "FortiGate Telemetry & Network Continuity Research Platform"
  dashboard_subtitle: "FortiGate 50F Telemetry Collector"

# --- Acquisition ------------------------------------------------------------
collector:
  sampling_interval_seconds: 60
  # If a cycle runs longer than the interval, the next scheduled run is skipped
  # (never queued) and a MISSING_INTERVAL event is recorded.
  max_cycle_overrun_seconds: 55
  # Number of consecutive failed cycles before an API_ERROR event is raised.
  failure_event_threshold: 3
  # Endpoints/metrics that are permanently unavailable on this device (FGT-50E,
  # FortiOS 6.0.4: no temperature sensor, no SD-WAN Performance SLA). Their
  # absence every cycle is a device limitation, NOT an incomplete record.
  optional_missing: ["sensor_info", "sla_metrics"]

# --- FortiGate WAN / device ------------------------------------------------
device:
  wan_interface: "wan1"
  # Contracted link speed (Mbps) used for utilisation %. Set to null to read
  # the negotiated speed from the interface instead.
  wan_speed_down_mbps: 200
  wan_speed_up_mbps: 200

# --- FortiOS REST API endpoints ------------------------------------------------
# GET only. Paths are relative to  https://<host>:<port>/api/v2/
# These are CANDIDATE endpoints for FortiOS 7.x and MUST be validated against the
# real device with:  python scripts/probe_fortios_endpoints.py
# If an endpoint 404s on your firmware, adjust it here - no code change needed.
# A missing endpoint => the affected metrics are stored as NULL, the cycle continues.
fortios_endpoints:
  system_status:        "monitor/system/status"
  system_resource:      "monitor/system/resource/usage"
  system_interface:     "monitor/system/interface"
  interface_select:     "monitor/system/interface/select"
  available_interfaces: "monitor/system/available-interfaces"
  router_ipv4:          "monitor/router/ipv4"
  sensor_info:          "monitor/system/sensor-info"
  sdwan_health_check:   "monitor/virtual-wan/health-check"
  sdwan_members:        "monitor/virtual-wan/members"
  cmdb_interface:       "cmdb/system/interface"
  cmdb_global:          "cmdb/system/global"
  firmware:             "monitor/system/firmware"
  time:                 "monitor/system/time"

# --- Performance SLA mapping ------------------------------------------------
# Maps the FortiGate health-check NAME (left, exact) to a friendly label + target.
# These names must match the Performance SLA entries created on the FortiGate
# (SD-WAN > Performance SLA). Until they exist, virtual-wan/health-check returns
# nothing and the aggregate latency/jitter/loss are filled from the Pi's ICMP
# prober instead. Once they report data, telemetry_sla is populated per target.
sla_targets:
  Cloudflare: { label: "cloudflare", target: "1.1.1.1" }
  Google:     { label: "google",     target: "8.8.8.8" }
  Quad9:      { label: "quad9",       target: "9.9.9.9" }
  # DUOC:     { label: "duoc",        target: "changeme.duoc.cl" }

# --- ICMP prober (runs on the Raspberry Pi, independent cross-check) ---------
icmp_prober:
  enabled: true
  count: 4                # echo requests per target per cycle (targets run in parallel)
  timeout_seconds: 1
  # aggregate=false -> still recorded in probe_results, but excluded from the
  # aggregate latency/jitter/loss (so the LAN hop does not skew internet-path stats).
  targets:
    - { label: "isp_router",  address: "192.168.1.1", aggregate: false }
    - { label: "cloudflare",  address: "1.1.1.1" }
    - { label: "google",      address: "8.8.8.8" }
    - { label: "quad9",       address: "9.9.9.9" }

# --- Derived features -------------------------------------------------------
features:
  enabled: true
  # Recompute the feature table this often (seconds).
  recompute_interval_seconds: 300
  windows_minutes: [5, 10, 15]

# --- Dashboard thresholds --------------------------------------------------
# VISUAL ONLY. These are NEVER used to auto-generate machine-learning labels.
thresholds:
  latency:      { warning: 80,  critical: 150 }   # ms
  jitter:       { warning: 20,  critical: 50 }    # ms
  packet_loss:  { warning: 1,   critical: 5 }     # %
  cpu:          { warning: 70,  critical: 90 }    # %
  memory:       { warning: 70,  critical: 90 }    # %
  rx_utilization: { warning: 70, critical: 90 }   # %
  tx_utilization: { warning: 70, critical: 90 }   # %

# --- Gap detection --------------------------------------------------------
gaps:
  # A gap is recorded when: (now - previous_sample) > interval + tolerance
  tolerance_seconds: 30

# --- Machine-learning labelling (prepared, NOT applied automatically) -------
ml_labels:
  classes:
    0: "NORMAL"
    1: "DEGRADATION"
    2: "FAILURE"
  auto_label: false        # MUST stay false - labels are assigned manually later

# --- Backups -------------------------------------------------------------------
backup:
  enabled: true
  schedule_hour: 3         # local time
  schedule_minute: 0
  keep_days: 7
  filename_prefix: "fortigate_"

# --- Dashboard behaviour --------------------------------------------------
dashboard:
  refresh_interval_seconds: 30
  history_ranges: ["1h", "6h", "12h", "24h", "7d", "30d"]

# --- Logging -------------------------------------------------------------------
logging:
  filename: "collector.log"
  max_bytes: 10485760      # 10 MB
  backup_count: 10
